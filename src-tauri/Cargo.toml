[package]
name = "fileview"
version = "0.1.0"
description = "Windows 11 style multi-format file viewer & editor"
authors = ["FileView Team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
